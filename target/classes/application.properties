# ==========================================
# Configuración Servidor y Aplicación
# ==========================================
spring.application.name=julietphotography-backend
server.port=8080
server.servlet.context-path=

# ==========================================
# Base de Datos SQLite (Persistencia Inmediata)
# ==========================================
spring.datasource.url=jdbc:sqlite:julietphotography.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ==========================================
# JPA / Hibernate 6 con Dialecto SQLite
# ==========================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Subida de Archivos Multimedia (Multipart)
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Directorio base para imágenes subidas
app.upload.dir=uploads

# ==========================================
# Seguridad JWT (Spring Security)
# ==========================================
# Clave secreta HMAC-SHA de 256 bits en Base64 o Hex
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
# Expiración: 24 horas (en milisegundos)
app.jwt.expiration-ms=86400000

# ==========================================
# CORS Orígenes Permitidos
# ==========================================
app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000
