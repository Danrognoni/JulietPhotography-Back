# ==========================================
# Configuración Servidor y Aplicación
# ==========================================
spring.application.name=julietphotography-backend
server.port=8080
server.servlet.context-path=

# ==========================================
# Compresión HTTP (Zero Latency Transfer)
# ==========================================
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# ==========================================
# Base de Datos SQLite (Persistencia Inmediata & Alto Rendimiento)
# ==========================================
spring.datasource.url=jdbc:sqlite:julietphotography.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# HikariCP Tuning para SQLite Concurrente
spring.datasource.hikari.pool-name=JulietPhotographyHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-init-sql=PRAGMA busy_timeout = 5000; PRAGMA synchronous = NORMAL;

# ==========================================
# JPA / Hibernate 6 con Dialecto SQLite
# ==========================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Subida de Archivos Multimedia (Multipart)
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Directorio base para imágenes subidas
app.upload.dir=uploads

# ==========================================
# Seguridad JWT (Spring Security)
# ==========================================
# Clave secreta HMAC-SHA de 256 bits en Base64 o Hex
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
# Expiración: 24 horas (en milisegundos)
app.jwt.expiration-ms=86400000

# ==========================================
# CORS Orígenes Permitidos (Soporta puertos dinámicos en desarrollo)
# ==========================================
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*,*

