# ==========================================
# Configuración Servidor y Aplicación
# ==========================================
spring.application.name=julietphotography-backend
server.port=8080
server.servlet.context-path=

# ==========================================
# Compresión HTTP (Zero Latency Transfer)
# ==========================================
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# ==========================================
# Base de Datos PostgreSQL (Persistencia Desacoplada & Alto Rendimiento)
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/julietphotography}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================================
# Subida de Archivos Multimedia (Multipart)
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Directorio base para imágenes subidas
app.upload.dir=uploads

# ==========================================
# Seguridad JWT (Spring Security)
# ==========================================
# Clave secreta HMAC-SHA de 256 bits en Base64 o Hex
app.jwt.secret=5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
# Expiración: 24 horas (en milisegundos)
app.jwt.expiration-ms=86400000

# ==========================================
# CORS Orígenes Permitidos (Soporta puertos dinámicos en desarrollo)
# ==========================================
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,https://localhost:*,https://127.0.0.1:*,https://*.vercel.app,https://juli-fotografia-front-oafx.vercel.app

# ==========================================
# Mercado Pago API Configuración (Checkout Pro & IPN)
# ==========================================
mercadopago.access-token=APP_USR-2823848204996524-090500-8cf1cc4cc33c4a12bbdde5762986f164-3666810022
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.back-urls.success=http://localhost:4200/cart?status=approved
mercadopago.back-urls.failure=http://localhost:4200/cart?status=rejected
mercadopago.back-urls.pending=http://localhost:4200/cart?status=pending
mercadopago.notification-url=${MP_NOTIFICATION_URL:https://tu-dominio.com/api/mercadopago/webhook}

# ==========================================
# Cloudinary Media Storage (Cloud CDN)
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ==========================================
# Configuración Servicio de Correo SMTP (Gmail)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Casilla de destino para el formulario de contacto
app.mail.to=${MAIL_TO:julietamarateo4@gmail.com}

